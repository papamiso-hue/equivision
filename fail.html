<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>결제 안내 | EquiVision AI</title>
  <meta name="theme-color" content="#090d16">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23090d16'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-family='Arial,sans-serif' font-weight='800' font-size='38' fill='%2338bdf8'%3EE%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <style>
    :root { --primary: #0284c7; --bg: #090d16; --card: #111827; --soft: #0f1624; --border: #1f2937; --mid: #374151; --text: #f8fafc; --sub: #a3b0c2; }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    body { background: var(--bg); color: var(--text); font-size: 17px; line-height: 1.75; word-break: keep-all; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem; }
    .box { width: 100%; max-width: 520px; background: var(--card); border: 1px solid var(--mid); border-radius: 18px; padding: 2rem 1.6rem; text-align: center; }
    .icon { font-size: 2.6rem; }
    h1 { font-size: 1.5rem; margin: 0.4rem 0; }
    p { color: var(--sub); }
    .detail { margin-top: 1.2rem; background: var(--soft); border: 1px solid var(--border); border-radius: 10px; padding: 0.8rem 1rem; font-size: 0.9rem; color: var(--sub); text-align: left; word-break: break-all; }
    .actions { display: flex; flex-wrap: wrap; gap: 0.7rem; margin-top: 1.5rem; justify-content: center; }
    .btn { display: inline-block; text-decoration: none; font-weight: 700; padding: 0.8rem 1.3rem; border-radius: 10px; }
    .btn.primary { background: var(--primary); color: #fff; }
    .btn.ghost { border: 1px solid var(--mid); color: #cbd5e1; }
  </style>
</head>
<body>
  <main class="box">
    <div class="icon">⚠️</div>
    <h1>카드·간편결제는 현재 이용할 수 없습니다</h1>
    <p>결제 금액은 청구되지 않았습니다.<br>계좌 입금으로 신청해 주세요. 신청 화면에서 입금 계좌와 입금자명을 알려 드립니다.</p>
    <div class="actions">
      <a class="btn primary" href="store.html#checkout">입금 신청하러 가기</a>
      <a class="btn ghost" href="store.html#cancel">환불·종료 안내</a>
    </div>
  </main>
</body>
</html>
